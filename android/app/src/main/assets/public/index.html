      background-color: #0f172a;
      color: #ffffff;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;

    .spinner {
      width: 48px;

    @keyframes spin {
      to { transform: rotate(360deg); }

    h1 { font-size: 18px; margin: 0 0 8px; font-weight: 700; }
    p { font-size: 13px; color: #94a3b8; margin: 0; }
