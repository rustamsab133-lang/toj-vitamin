<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- System font directories -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  
  <!-- Vercel serverless function directory -->
  <dir>/var/task/public/fonts</dir>
  
  <!-- Local development directory -->
  <dir>./public/fonts</dir>
  
  <!-- Temporary writeable cache directory for Vercel -->
  <cachedir>/tmp/fonts-cache</cachedir>
  
  <config></config>
</fontconfig>
